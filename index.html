<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12100e">
  <meta name="description" content="Dice Delve — board-roguelike 3D stylized: lempar dadu, jelajahi papan prosedural, kumpulkan kartu, lawan boss.">
  <title>Dice Delve</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Karla:wght@400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/ui/styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="loader" class="loader">
    <div class="loader__mark"></div>
    <p class="loader__text">Menyiapkan meja…</p>
    <div class="loader__bar"><span id="loader-fill"></span></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
